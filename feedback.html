<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marvel - Feedback</title>

    
    <link rel="icon" href="stan-lee.png">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Início</a>
            <a href="personagens.html">Personagens</a>
            <a href="https://www.marvel.com/"> Site Oficial da Marvel</a>
            <a href="feedback.html"> Feedback </a>
        </nav>

        <hr>

        <h1>Personagens Marvel</h1>
    </header>


    <main>

        <section>

            <h2>Cadastro de fã</h2>

            <p>
                Preencha o formulário abaixo para deixar sua opinião
                sobre o universo Marvel.
            </p>

           
        
            <form>
                
                <label for="nome">Nome:</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
                <br>

                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
                <br>

                <label for="personagem">
                    Personagem favorito:
                </label>

                <select id="personagem" name="personagem">

                    <option>Homem-Aranha</option>
                    <option>Homem de Ferro</option>
                    <option>Capitão América</option>
                    <option>Thor</option>
                    <option>Hulk</option>
                    <option>Pantera Negra</option>

                </select>
                <br>

                <label for="mensagem">
                    Por que você gosta desse personagem?
                </label>
                <br>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="5"
                    placeholder="Digite sua resposta..."
                ></textarea>
                <br>

                <button type="submit">
                    Enviar
                </button>

            </form>

        </section>


        <section>

            <h2>Saiba mais</h2>

            <p>
                Para conhecer mais sobre os personagens e histórias,
                visite o site oficial da Marvel!
            </p>

           

        </section>

    </main>

    <hr>

    <footer>
      <small>Site sobre a Marvel - 2026</small>
    </footer>

</body>

</html>
